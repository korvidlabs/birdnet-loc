[project]
name = "birdloc"
version = "0.1.0"
description = "Where in the yard was that bird? Multi-microphone location estimates and e-ink boards from BirdNET-Go detections"
readme = "README.md"
license = "MIT"
authors = [{ name = "Kory Kirk", email = "kory@korvidlabs.com" }]
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "pillow>=10.4",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["birdloc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
