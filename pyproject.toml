[project]
name = "birdnet-loc"
version = "0.1.0"
description = "Where in the yard was that bird? Loudness-weighted location estimates from multi-microphone BirdNET-Go detections, drawn over a map of your yard"
readme = "README.md"
license = "MIT"
authors = [{ name = "koryk", email = "hello@korvidlabs.com" }]
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "pillow>=10.4",
]

[project.scripts]
bands-tool = "birdnet_loc.bands_tool:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["birdnet_loc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
